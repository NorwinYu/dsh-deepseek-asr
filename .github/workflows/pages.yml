name: Deploy plugin index to Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Parse the index with the same validator DSH ships. Pinned, because the
      # package publishes prereleases and `latest` may lag the app build.
      - name: Validate index format
        run: |
          npm install --no-save @deepseek-ai/dsh-plugin-market-index@0.2.2-rc.5
          node --input-type=module -e "
            import { readFile } from 'node:fs/promises'
            import { parseMarketIndex } from '@deepseek-ai/dsh-plugin-market-index'
            const url = 'https://norwinyu.github.io/dsh-deepseek-asr/index.json'
            const doc = JSON.parse(await readFile('site/index.json', 'utf8'))
            const parsed = parseMarketIndex(doc, url)
            const first = parsed.plugins[0]
            console.log('index ok:', parsed.plugins.length, 'plugin(s);',
              first.name, first.versions[0].version,
              'from', first.versions[0].source.type)
          "

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pages is served from the gh-pages branch (Settings -> Pages -> Deploy
      # from a branch). Publishing with git keeps the deployment independent of
      # the Pages deployment API, which rejected this repository's artifacts.
      - name: Publish site/ to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pages"
          cp -R site/. "$RUNNER_TEMP/pages/"
          cd "$RUNNER_TEMP/pages"
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
